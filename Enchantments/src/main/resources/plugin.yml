name: Enchantments
version: 1.1
main: org.arkhamnetwork.enchantments.Enchantments
depend: [ EnchantmentAPI, Essentials, CosmicSkyCustomItems, ParticleLIB ]
softdepend: [mcMMO, FactionUpgrades, CosmicDungeons, CosmicSkyCustomItems ]
commands:
  enchbook:
    description: Root command.
    usage: /<command>
  enchdust:
  enchorb:
  enchscroll:
  tinkerer:
  enchanter:
  transmog:
  alchemist:
