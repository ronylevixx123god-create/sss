# Enable or disable different modules of Arkkit.
patches:
  # Disables spigot's built in async method catcher.
  async_spigot: true

  # Enables monster spawner entity stacking.
  async_monsters: false

  # Blocks many common dupe exploits, adds /scanchests if ArkhamPickaxes+ArkhamBags enabled.
  anti_dupe: true

  # Monitors and corrects memory leaks and catches crash issues, also automatically reboots servers with unstoppable crashes.
  anti_crash: true

  near_legacy: true
  # Automatically reboots servers with >9H uptime and <17TPS
  anti_lag: true

  # Prevents resource leakage when using per-player scoreboards.
  anti_scoreboard_leak: false

  # Loot can only be picked up by the killer of the entity for a few seconds.
  anti_loot_steal: false

  # Enables compilex's inhouse built anti-cheating suite.
  anti_hack: false

  better_trade: true

  # Prevents known minecart dupes.
  anti_minecart: false

  # Anti Macro anti-cheat captcha checker
  anti_macro: false

  # Scans and removes excessive tile entities.
  anti_tile_entity_lag: false

  # Fixes block glitching and jumping.
  anti_block_glitch: false

  # Enables /arktoken and /token command to set and get EToken values.
  arkham_tokens: false

  # Prevents god apples from being crafted.
  anti_god_apple_craft: false

  # Localized redstone throttling to prevent user-made lag machines and infinite loops.
  anti_redstone_lag: true

  # Prevents non-OP'd players in survival from having the "invisibility" potion effect.
  anti_invisibility: false

  # Prevent annoying spam bots.
  anti_spam_bot: false

  # Prevents destruction of entities and blocks that have an me.astropvp.cratekeys.inventory actively being viewed, Fixes a dupe exploit on Factions.
  anti_inventory_hijack: true

  # Adds a number of custom aliases/hooks and me.astropvp.cratekeys.net.astropvp.armorsets.commands for ArkhamNetwork such as /sidekick and /powers.
  arkham_commands: false

  # Global cross-server alert system. Supports LilyPad only.
  alert_system: false

  # Enables /tnt - Automatically crafts all tnt ingredients in me.astropvp.cratekeys.inventory.
  auto_craft_tnt: false

  # Reboots servers after 12h of uptime.
  auto_reboot: true

  # Automatically respawns dead players.
  auto_respawn: false

  # Activates /clearlagg-like task that removes all entities on a set interval.
  auto_entity_clear: false

  # Custom /balance command
  balance: false

  # Enables compilex's optimized version of /baltop
  balance_top: false

  # Disables BanManager duplicate IP nagging.
  ban_manager_plus: false

  # Enables boss bar alert system.
  bar_announcer: false

  # Prevents placement of boats due to possible dupe exploits.
  boat_blocker: false

  # Enables/ /bump to deal self damage in non-enemy areas.
  bump: false

  # Disables all incremental I/O saving, only saves on server shutdown, costs RAM, saves (massive) CPU.
  bulk_saving: false

  # Disables buycraft auto updating
  buycraft_security: true

  # Unload all chunks on disable
  safe_shutdown: true

  # Advanced GC system for minecraft chunks. Greatly reduces RAM usage and CPU from tick iterations.
  chunk_gc: true

  # Enables chat bubbles over player's heads with the arkkit.chatbubble permission!
  chat_bubbles: false

  # Enables a chat limiter with configurable delays between chat messages, and a custom VIP delay and permission node.
  chat_limiter: false

  # Enables a dynamic word filtering system via /censor.
  chat_filter: true

  # Adds compilex /clearinventory with confirmation.
  clear_inventory_confirm: false

  # Removes entities in chunks when they are loaded.
  chunk_load_flush: false

  # Adds Christmas themed trinkets to the gamemode!
  christmas: false

  # Allows for dynamic command blocking / unblocking.
  command_blocker: true

  # Kills players who logout while within 10s of combat in pvp-enabled area.
  combat_log: false

  # Enables per-player command cooldown functionality through command-cooldowns.yml!
  command_cooldowns: false

  # Customize the otherwise bland essential's /broadcast prefix.
  custom_broadcast: false

  # Enables /cmotd command along with a custom, configurable, delayed MOTD.
  custom_motd: false

  # Enables /createtitle and /addcreatetitle me.astropvp.cratekeys.net.astropvp.armorsets.commands to purchase and create custom player titles.
  create_title: false

  # Multiplies vanilla xp drops by specified amount, default 2x.
  double_xp: false

  # Enables the ability to get drinks and get drunk, woo!
  drinks: false

  # Enables /deathpoint (/back alternative) that allows players to return to previous location of death.
  deathpoint: false

  # Prevents droppers from dispensing me.astropvp.cratekeys.items, stopping throwable item dupe exploit on Factions.
  dropper_blocker: false

  # Enables /setmaxplayers to set the server slots dynamically.
  dynamic_max_players: false

  # Enables a number of different easter only events.
  easter: false

  # Removes entities that are heading towards unloaded chunks. Saves RAM, CPU from tick iterations.
  entity_cleaner: false

  # Enables sale of non eula compliant perks via soft currency.
  eula: false

  # Enables enderpearl cooldowns
  enderpearl_cooldown: false

  # Disables EnchantmentAPI anvil and enchantment table mechanics.
  enchantment_anvil_fix: false

  # Enables per-warp /aliase me.astropvp.cratekeys.net.astropvp.armorsets.commands. So /warp test will become /test, useful in prison server configurations.
  essentials_warp_aliases: false

  # Enables /addhomes to add extra essentials /homes to players.
  essentials_add_homes: false

  # Enables a /warp me.astropvp.cratekeys.inventory menu. Warps to be displayed can be configurred.
  essentials_warp_ui: false

  # Enables ability to use /xpbottle to withdraw vanilla levels into exp bottles.
  exp_bottles: false

  # Prevents teleportation to enemy faction claims.
  faction_teleport_sanity: false

  # Send players back to lobbies when a server shuts down. Supports LilyPad only.
  fallback_servers: false

  # Enables /fill which automatically fills dispensers with TNT from me.astropvp.cratekeys.inventory.
  fill_command: false

  # Enables a bunch of silly modifications for Rob/Preston end of season 3.
  final_battle: false

  # Enables /forcespawn <radius>, sending all players around executor to world's /spawn. Great for moderation.
  force_spawn: true

  # Enables Item ID tracking.
  item_id: false

  # Enables moderation tools for the hacker hub.
  hacker_hub: false

  # Enables some goofy 4th of July celebrations
  july_freedom: false

  # Enables player net.astropvp.gambling me.astropvp.cratekeys.net.astropvp.armorsets.commands such as /roll.
  gamble: false

  # Makes creative gamemode persist between worlds.
  global_gamemode: false

  # Enables /giveall command for server giveaways, permission and OP restricted.
  give_all: false

  # Enables /hitme command to deal self inflicted damage.
  hit_me: false

  # Enables right-click-to-equip mechanic for armor.
  hotbar_armor_swap: false

  # Enables /hub command that teleports users to a random fallback-server.
  hub_command: false

  # Hides vanilla player join, quit, and death messages.
  hide_stream: true

  # Hides specific lore and item attributes via ProtocolLib.
  hide_lore: false

  # Enables all perks for 'the_joker' permission group on ArkhamNetwork.
  joker_perks: false

  # Enables golden apple sickness.
  golden_apple_sickness: true

  # Enables /senditem command and ability to link me.astropvp.cratekeys.items in chat by typing [ITEM]. Requires permission node, itemlinking.senditem.
  item_linking: false

  # Adds capability for sponges to absorb lava.
  lava_sponge: false

  # Throttles water flow when no players are around or if an impossible amount of events occur in a short period of time.
  tick_ratelimit: true

  # Prevents players in survival mode from flying above y:256
  max_fly_height: false

  # Enables ability to claim mcmmo credit vouchers.
  mcmmo_credits: false

  # Enables reboot sanity for minigame servers that don't properly reboot at the end of their games.
  minigame_reboot_sanity: false

  # Enables enchanted buckets with multiple uses.
  more_buckets: false

  # Enables mystery mob spawner item and sell signs.
  mystery_mob_spawner: false

  # Fixes exploit with &username= spoofing
  name_sanity: false

  # Prevents players from building above nether, and creating portals in nether.
  nether_glitch_fix: false

  # Enables New Year specifical special me.astropvp.cratekeys.items.
  new_years: false

  # Automatically despawns monsters in pvp disabled regions when hit.
  no_safezone_mobs: false

  # Prevents users from losing item being held on cursor on me.astropvp.cratekeys.inventory close.
  no_cursor_drop: false

  # Fixes WorldGuard's lava-flow flag.
  no_lava_flow_region: false

  # Disables block physics updates caused by exploding creepers.
  no_explosion_physics: false

  # Disable lava flow globally.
  no_lava_flow: false

  # Disables water protection for mobspawners.
  no_water_prot_spawners: false

  # Prevents users from enchanting books on enchantment tables.
  no_enchantment_table_books: false

  # Disables mcMMO's unarmed ability to disarm.
  no_mcmmo_disarm: false

  # Disables mcMMO level caps without allow them to become more powerful past presets.
  no_mcmmo_limits: false

  # Prevents server from ever enabling whitelist.
  no_whitelist: false

  # Enables bugfixes for ObsidianDestroyer module.
  obsidian_destroyer_fixes: false

  # Prevents users from using potions with a stack size > 1.
  potion_stack_limiter: false

  # Removes pickaxes with impossible enchantment levels on them.
  pickaxe_sanity: false

  # Enables ability to get player heads from PvP. Default chance is 5%.
  player_heads: false

  # Enables parkour region functionality.
  parkour_region: false

  # Enables display of seasonal planet victory prefixes.
  seasonal_prefixes: false

  # Enables /suicide command
  suicide: false

  # A very safe patch that fixes a slew of known bugs in 3rd party plugins.
  # a.) Fixes double spaces caused by EssentialsChat.
  # b.) Fixes me.astropvp.cratekeys.inventory exploit with UltimateParticles.
  plugin_fixes: true

  # Nerfs vanilla potion behavior to prevent crazy OP effects like STR III.
  potion_fix: false

  # Fixes a number of known bugs in PlotMe. Such as trapped chest protection not working.
  plotme_patches: false

  # Prevents players from obtaining the server's plugin list through means such as /pl /plugin /? /help:, etc.
  plugin_hider: true

  # Prevents disguises and pets from being present for non-OP in PvP enabled WG regions.
  pvp_rules: true

  # Enables marriage and /marry for players on local server.
  marriage: false

  # Prevents explosions and sand stacking above y:255
  max_height_logic: false

  # Enables cross-server /message, /reply, and /find. Supports LilyPad only.
  network_events: false

  # Teleports users stuck in nether portal to spawn.
  nether_portal_trap: false

  # Removes half of all vanilla nether spawners.
  nerf_nether_spawners: false

  # Custom /near command
  near: false

  # Disables book signing.
  no_book_sign: false

  # Replaces all cave spiders with normal spiders as they spawn.
  no_cave_spiders: false

  # Clips wings of players who engage in PvP or PvE combat for 10s.
  no_combat_flying: false

  # Hijacks bukkit's "Login Queue" functionality, which can often cause netty overloads and selector rebuilds.
  no_login_queue: false

  # Disables fire and firespread from server tick(), saves CPU.
  no_fire_ticking: true

  # Disables players from riding horses to prevent vanilla noclipping.
  no_horse_ride: false

  # Disables mobGriefing gamerule on all worlds to prevent 1.8 dupe with hostile mob item pickup.
  no_mobgriefing: true

  # Disables all mcMMO EXP gains from monster slaying.
  no_mob_mcmmo: false

  # Disables natural mob spawning from server tick(), saves CPU.
  no_natural_mobs: false

  # Prevents new chunks from generating in worlds specified in no_new_chunks.worlds section of configuration.
  no_new_chunks: false

  # Disables LilyEssentials's spammy LilySpy functionality on local server.
  no_lily_spy: true

  # Disables item transfers to and from hoppers.
  no_hoppers: false

  # Disable vanilla villager trading mechanic in gamemode.
  no_villager_trading: true

  # Prevents void damage, replaces broken y:0 bedrock.
  no_void_damage: false

  # Enables enforcement of automatically op'ing and de'oping players with(out) * or *.* permission node on login.
  op_permission: true

  # Enables /shop and ability to create player-owned shops.
  player_shops: false

  # Display player health under player's names.
  player_health: true

  # Clear potion effects whenever a player goes between a pvp and non-pvp WG flagged area.
  pvp_potion_effects: false

  # Improved default spigot language messages to be more informative, allows for custom store_url and global_prefix to be configured into the improved messages.
  spigot_branding: false

  # Charges players $ for mining spawners.
  spawner_fee: false

  # Treasure wars mcmmo credits
  skill_gems: false

  # Enables /shop to teleport to server shop location.
  shop_command: false

  # Enables special party login me.astropvp.outpost.listener.
  party: false

  # Adds limitations to amount of stackable physics me.astropvp.cratekeys.items.
  sand_stack_limiter: false

  # Prevents /tpaccept exploitation into enemy faction bases.
  smarter_essentials: false

  # Toggles spigot debug boolean.
  spigot_debug: true

  # Enables /raidshop
  raid_shop: false

  # Enables an array of specifically named NPC interaction events to give prizes to players.
  reward_npc: false

  # Deletes empty tile entities (chests) as chunks load to decrease CPU tick iterations.
  tile_entity_cleaner: false

  # Enables TreasureWar's version of /tnt
  tw_auto_craft_tnt: false

  # Enables /teams and the ability for players to create parties.
  teams: false

  # Enables slot taper, slowly increases max slots to prevent network thread dieing from spam join.
  taper_slots: false

  # Enables custom [TAB] list headers and footers.
  tab_list: false

  # Enables dynamic adjustment of spigot's maxTntPerTntTick setting in spigot.yml.
  tnt_limiter: false

  # Adds random Thanksgiving Turkey spawns.
  thanksgiving: false

  # Enables /trade and ability to trade me.astropvp.cratekeys.items with other players through GUI.
  trading: false

  # Enables TP warmup times based on player EXP levels.
  tp_warmup: false

  # Enables valentine day specific features.
  valentines_day: false

  # Enables voting rewards and tracking.
  voting: false

  # Enables some VIP youtuber me.astropvp.cratekeys.net.astropvp.armorsets.commands.
  youtubers: false

  # Enables showcase expander me.astropvp.cratekeys.items.
  showcase_expander: false

  # Disables weather events on all worlds on local server.
  no_weather: false

  # Allows all players to destroy double plants on left click.
  no_tall_grass: false

  # Disables teleportation events while in a vehicle.
  no_vehicle_teleport: false

  # Enables /redeem mcmmo functionality.
  redeem_mcmmo: false

  # Prevents arrows from bouncing and hitting the shooter.
  no_arrow_bounce: true

  # Enables /wilderness - Teleports caster to random location in Faction wilderness.
  wilderness_command: false

  # Optimizes per-world tick iteration CPU cost. Growth, Tracking, etc.
  # Essentials injects a customized spigot.yml into server memory.
  world_tick_optimizer: false

  # Enables /forums and /report website hotlinks.
  website_links: false

  # Enables /syncaccount capability to sync minecraft accounts to forum accounts.
  xenforo_sync_account: false

  # Automatically removes, resets, and bans users with impossible exp values.
  xp_sanity: true

  # Directly adds XP to the player who killed the monster.
  xp_direct_deposit: true

  # Enables dropping XP on death in bottle form.
  xp_loss: false

  # Enables /xptop and /oenderchest
  ypperin: false

  # Charge players for claiming chunks near warzones.
  warzone_claims: false

  # Enables /withdrawmcmmo ability to withdraw raw mcmmo xp.
  withdraw_mcmmo: false

  # Enables an array of WorldBorder fixes, incl. proper piston handling.
  world_border_fixes: false
  # Enables /home net.astropvp.armorsets.gui that allows for customizable home icons.
  home_gui: false
  # Enables /f warp net.astropvp.armorsets.gui that allows for customizable warp icons.
  warp_gui: false
  # Enables /pv net.astropvp.armorsets.gui that allows for customizable vault icons and names.
  vault_gui: false
  #Detect extremely obvious anti knockback hacks by checking their height after receiving a packet.
  antikb_detection: false
  #Schematic updater, *** set ftp.host and settings in schematicCreds.yml ***
  schematic_updater: false
  #Extra mute functions for ips and factions.
  extra_mutes: false
  no_dupe_exploit: true

  # Enables combining of raw materials/ores with /combine.
  condense_command: false

  # Enables dynamic rewards from staying mobile in main warzone.
  warzone_money: false

  # Enables reward system for players on Cosmic Client.
  cosmic_client_helper: false

  # Blocks a bunch of misc. exploits.
  anti_exploit: false
